<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echoss VIP — Layout（ProLayout mix）v5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
     Echoss VIP — Layout（ProLayout layout="mix"，以 stage 後台實測值鎖定）
     實測幾何：header {x:256,y:0,w:1256,h:56} + logo 區(左 256×56)
               sider {x:0,y:56,w:256}  → 選單在 header 帶下方
     ▸ 全站白底（body/layout/sider/header/content 皆透明→白）
     ▸ header 帶下緣 1px 全寬線；sider 右緣 1px 線（僅 y≥56）
     ▸ header actions padding 0 50 / logo 區寬 256
     ▸ menu 240（sider 內縮 8）/ item 40 高、padding 0 16、radius 6
     ▸ 選中 bg rgba(0,0,0,.04) + color rgba(0,0,0,.95) / icon 14 / font Noto Sans TC 14
     ========================================================================= */
    :root {
      --colorPrimary: #07C373;
      --colorLink: #1BAA6D;
      --colorWarning: #FCB321;
      --colorError: #FF4D4F;
      --colorInfo: #1A9CFF;
      --pageBg: #f5f5f5;
      --colorBgContainer: #ffffff;
      --colorBorder: #D9D9D9;
      --colorSplit: #f0f0f0;
      --colorText: rgba(0, 0, 0, 0.88);
      --colorTextSecondary: rgba(0, 0, 0, 0.65);
      --colorTextTertiary: #8c8c8c;
      --colorTextPlaceholder: rgba(0, 0, 0, 0.25);
      --colorMenuSelBg: rgba(0, 0, 0, 0.04);
      --colorMenuSelText: rgba(0, 0, 0, 0.95);
      --fontFamily: 'Noto Sans TC', sans-serif;

      --headerHeight: 56px;
      --headerPadX: 16px;
      --siderWidth: 256px;
      --siderCollapsedWidth: 64px;
      --menuGutter: 8px;
      --menuItemHeight: 40px;
      --iconSize: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: var(--fontFamily);
      font-size: 14px;
      color: var(--colorText);
      background: linear-gradient(#ffffff, #f5f5f5 28%) fixed;
      -webkit-font-smoothing: antialiased;
    }

    /* <Layout>(垂直) ── Header(全寬) + <Layout hasSider>(Sider + Content) */
    .pro-layout {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: transparent;
    }

    /* ---------- Header（全寬帶，白底，下緣全寬線）---------- */
    .pro-header {
      height: var(--headerHeight);
      flex: 0 0 auto;
      display: flex;
      align-items: stretch;
      background: transparent;
      border-bottom: 1px solid var(--colorSplit);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    /* 左側 logo 區：寬度對齊 sider（256），與下方選單同欄 */
    .pro-header__logo {
      width: var(--siderWidth);
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      transition: width .2s;
    }

    .pro-header__logo img {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      display: block;
    }

    .pro-header__logo .logo-fallback {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: #1f1f1f;
      display: none;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
    }

    .pro-header__logo .title {
      font-size: 17px;
      font-weight: 700;
      color: var(--colorText);
      white-space: nowrap;
      letter-spacing: .2px;
    }

    /* 右側 actions 區 */
    .pro-header__actions {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
      padding: 0 var(--headerPadX);
    }

    .lang-select {
      display: flex;
      align-items: center;
      gap: 24px;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--colorBorder);
      border-radius: 6px;
      color: var(--colorTextPlaceholder);
      font-size: 14px;
      cursor: pointer;
      min-width: 150px;
      justify-content: space-between;
      background: #fff;
    }

    .lang-select .chev {
      color: var(--colorTextTertiary);
      font-size: 12px;
    }

    .user-block {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .user-block .avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
    }

    .user-block .meta {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .user-block .meta .name {
      font-size: 14px;
      font-weight: 600;
      color: var(--colorText);
    }

    .user-block .meta .role {
      font-size: 12px;
      color: var(--colorTextTertiary);
    }

    .env-badge {
      background: var(--colorPrimary);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      padding: 5px 7px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* ---------- Body：Sider + Content ---------- */
    .pro-body {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
    }

    /* Sider：白底、右緣分隔線（在 header 帶下方，y≥56） */
    .pro-sider {
      position: relative;
      width: var(--siderWidth);
      flex: 0 0 auto;
      background: transparent;
      border-right: 1px solid var(--colorSplit);
      display: flex;
      flex-direction: column;
      transition: width .2s;
    }

    /* 收合鈕：sider 右上緣、壓在分隔線上 */
    .collapse-btn {
      position: absolute;
      top: 20px;
      right: -13px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--colorSplit);
      box-shadow: 0 2px 6px rgba(0, 21, 41, .08);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      color: var(--colorTextTertiary);
      font-size: 20px;
      z-index: 11;
      transition: transform .2s;
    }

    .pro-menu {
      list-style: none;
      margin: 0;
      padding: 0 var(--menuGutter);
      overflow-y: auto;
      flex: 1;
    }

    .pro-menu li {
      margin: 4px;
    }

    .pro-menu a {
      display: flex;
      align-items: center;
      gap: 8px;
      height: var(--menuItemHeight);
      padding: 0 16px;
      border-radius: 6px;
      color: var(--colorTextSecondary);
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      transition: background .2s, color .2s;
    }

    .pro-menu a .icon {
      width: var(--iconSize);
      height: var(--iconSize);
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pro-menu a .icon svg {
      width: var(--iconSize);
      height: var(--iconSize);
      fill: currentColor;
    }

    .pro-menu a .label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pro-menu a:hover {
      background: rgba(0, 0, 0, .04);
      color: var(--colorText);
    }

    .pro-menu li.selected a {
      background: var(--colorMenuSelBg);
      color: var(--colorMenuSelText);
      font-weight: 600;
    }

    /* Content：白底 */
    .pro-content {
      flex: 1 1 auto;
      min-width: 0;
      background: transparent;
      padding-block-start: 8px;
      padding-block-end: 16px;
      padding-inline-start: 40px;
      padding-inline-end: 40px;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 16px;
      padding-top: 8px;
    }

    .tabs {
      display: flex;
      gap: 28px;
      border-bottom: 1px solid var(--colorSplit);
      margin-bottom: 16px;
    }

    .tabs .tab {
      padding: 8px 0;
      color: var(--colorTextSecondary);
      cursor: pointer;
      position: relative;
      font-size: 14px;
    }

    .tabs .tab.active {
      color: var(--colorPrimary);
      font-weight: 600;
    }

    .tabs .tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: var(--colorPrimary);
    }

    .card {
      background: var(--colorBgContainer);
      border-radius: 6px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
    }

    .filter-row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .filter-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 220px;
    }

    .filter-item label {
      font-size: 14px;
      color: var(--colorText);
    }

    .filter-item .fake-input {
      height: 40px;
      border: 1px solid var(--colorBorder);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 11px;
      color: var(--colorTextPlaceholder);
      background: #fff;
    }

    .filter-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .btn {
      height: 40px;
      padding: 0 16px;
      border-radius: 6px;
      border: 1px solid var(--colorBorder);
      background: #fff;
      color: var(--colorText);
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
    }

    .btn.primary {
      background: var(--colorPrimary);
      border-color: var(--colorPrimary);
      color: #fff;
    }

    .content-note {
      color: var(--colorTextTertiary);
      font-size: 13px;
    }

    /* collapsed */
    body.collapsed {
      --siderWidth: var(--siderCollapsedWidth);
    }

    body.collapsed .pro-header__logo .title {
      display: none;
    }

    body.collapsed .pro-header__logo {
      justify-content: center;
      padding: 0;
    }

    body.collapsed .pro-menu a {
      justify-content: center;
      padding: 0;
    }

    body.collapsed .pro-menu a .label {
      display: none;
    }

    body.collapsed .collapse-btn {
      transform: rotate(180deg);
    }
  </style>
</head>
